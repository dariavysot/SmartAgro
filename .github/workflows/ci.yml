name: .NET CI & Test Coverage

on:
  push:
    branches: [ develop, main, feature/ci-workflow ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Backend and Test dependencies
      run: |
        dotnet restore SmartAgro.Api/SmartAgro.Api.csproj
        dotnet restore SmartAgro.Tests/SmartAgro.Tests.csproj

    - name: Run .NET Code Style Analysis (C4)
      run: |
        dotnet format SmartAgro.Core/SmartAgro.Core.csproj --verify-no-changes --severity info --no-restore
        dotnet format SmartAgro.Api/SmartAgro.Api.csproj --verify-no-changes --severity info --no-restore

    - name: Build backend and tests
      run: dotnet build SmartAgro.Tests/SmartAgro.Tests.csproj --no-restore --configuration Release

    - name: Run Unit Tests with Coverage
      run: |
        dotnet test SmartAgro.Tests/SmartAgro.Tests.csproj \
          --no-build \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --settings SmartAgro.Tests/coverlet.runsettings

    - name: Generate Code Coverage Report
      uses: danielpalme/ReportGenerator-GitHub-Action@v5
      with:
        reports: '**/coverage.cobertura.xml'
        targetdir: 'coveragereport'
        reporttypes: 'Html;MarkdownSummary'

    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodeCoverageReport
        path: coveragereport