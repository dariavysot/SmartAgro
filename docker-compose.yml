services:
  db:
    image: postgres:16-alpine
    container_name: smartagro-db
    restart: always
    environment:
      POSTGRES_DB: smartagro_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartagro-api
    restart: always
    ports:
      - "5240:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgreSql=Host=db;Port=5432;Database=smartagro_db;Username=postgres;Password=${POSTGRES_PASSWORD}
      - CryptoSettings__AesKeyBase64=${AES_KEY_BASE64}
      - CryptoSettings__HmacKeyBase64=${HMAC_KEY_BASE64}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=SmartAgro.Api
      - JwtSettings__Audience=SmartAgro.Client
    depends_on:
      - db

volumes:
  pgdata:
    name: smartagro_pgdata